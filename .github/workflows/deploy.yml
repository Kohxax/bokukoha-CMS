name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: git -C /opt/bokukoha-CMS pull

      - name: Build and restart containers
        working-directory: /opt/bokukoha-CMS
        run: |
          docker compose build
          docker compose down
          docker compose up -d
